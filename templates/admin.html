<!-- templates/index.html-->

<html lang="en">

<head>
    <title>Platforma Edukacyjna</title>
    <style>
        body
        {
            background: #53bbdb;
            background: linear-gradient(0deg, rgba(83, 187, 219, 1) 0%, rgba(45, 132, 253, 1) 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            align-content: center;
        }

        div
        {
            background-color: #FFFFFF;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
            border-radius: 10px;
            height: 90%;
            width: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        tr
        {
            border-bottom: 1px solid #333333;
        }

        tr:nth-child(even)
        {
            background-color: #EEEEEE;
        }

        table {
          width: 100%;
          text-align: left;
          border-collapse: collapse;
        }

        td {
          padding: 5px 4px;
        }

        input
        {
            width: 100%;
        }

    </style>
</head>

<body>
    <div>
        <h1>Admin Panel</h1>

        <a href="/">Return</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        <form method="POST"
            action="{{ url_for('sql') }}">
            <input style="width: 800px" type="text" name="query" placeholder="SQL Query" required="required">
            <button type="submit">submit</button>
        </form>

        {% if sql_query_result: %}
            <table>
            {% for row in sql_query_result %}
            <tr>
                {% for entry in row %}
                    <td>{{ entry }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
            </table>
        {% endif %}
    </div>
</body>

</html>
