<!-- templates/index.html-->

<html lang="en">

<head>
    <title>Platforma Edukacyjna</title>
    <style>
        body
        {
            background: #53bbdb;
            background: linear-gradient(0deg, rgba(83, 187, 219, 1) 0%, rgba(45, 132, 253, 1) 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            align-content: center;
        }

        div
        {
            background-color: #FFFFFF;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
            border-radius: 10px;
            height: 90%;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img
        {
            width : 100;
            height: auto;
            image-rendering: pixelated;
        }

        p_msg
        {
            border-style: dashed;
            border-color: #006600;
            border-radius: 10px;
            padding: 10px;
            background-color: #ccffcc;
        }

        n_msg
        {
            border-style: dashed;
            border-color: #ff6666;
            border-radius: 10px;
            padding: 10px;
            background-color: #ffcccc;
        }


    </style>
</head>

<body>

    <div>
        <a href="{{ url_for('admin_route') }}"><img src="/favicon.ico" alt="icon"></a>

        {% if status_message == "register_success": %}
            <p_msg>Registration Successful</p_msg>
        {% elif status_message == "register_fail": %}
            <n_msg>Registration Failed</n_msg>
        {% elif status_message == "login_fail": %}
            <n_msg>Login Failed</n_msg>
        {% endif %}

        <h2>Login</h2>
        <form method="POST"
              action="{{ url_for('login') }}">
            <input type="text" name="login" placeholder="login" required="required">
            <input type="password" name="password" placeholder="password" required="required">
            <button type="submit">submit</button>
        </form>

        <h2>Register</h2>


        <form method="POST"
              action="{{ url_for('register') }}">
            <input type="text" name="login" placeholder="login" required="required">
            <input type="password" name="password" placeholder="password" required="required">
            <input type="text" name="alias" placeholder="alias">
            <button type="submit">submit</button>
        </form>

        <a href="/auth_test">Auth test</a>
        <a href="/home">Home</a>
    </div>
</body>

</html>
